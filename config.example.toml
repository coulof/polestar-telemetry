# Copy to config.toml (gitignored) and adjust. Re-read on every poll: no restart needed.
# Override path with CONFIG_PATH; `--interval` / `--interval-active` on the collector win over this file.

# timezone = "Europe/Paris"   # for time-of-use tariffs and weekly reports (default Europe/Paris)

[poll]
interval = 300          # seconds between polls when parked/idle
interval_active = 60    # seconds while charging or driving (battery events arrive every ~2-6 min)

[service]
warn_days = 30     # dashboard warning when service is due within this many days...
warn_km = 1500     # ...or this many km

[alerts]
stale_hours = 6      # deploy/freshness.sh alerts when the collector has had no data from the API for this long

[co2]
# g_per_kwh = 60    # grid carbon intensity; enables CO2 figures in the Insights tab

[report]
enabled = true                # false turns the Claude integration off: no Report tab, no weekly report
timezone = "Europe/Paris"   # weeks run Monday to Sunday in this timezone
model = "sonnet"             # Claude Code model alias for the weekly report

[pricing]
# default_price_per_kwh = 0.25   # for charges away from any listed location; unset = cost unknown

[[location]]
name = "Home"
lat = 0.0
lon = 0.0
radius_m = 100
price_per_kwh = 0.0

[[location]]
name = "Example fast charger"
lat = 1.0      # made-up point; use your own coordinates
lon = 1.0
radius_m = 150
price_per_kwh = 0.20
# Optional fixed fee per charging session at a location, added to the energy cost: session_fee = 6.0
#
# Optional time-of-use pricing: [[location.tariff]] sub-tables belong to the [[location]] just above them.
# Within a window the tariff price replaces the location's price_per_kwh; windows may cross midnight.
# [[location.tariff]]
# from = "23:00"
# to = "07:00"
# price_per_kwh = 0.15
#
# Weekday-specific rate (from = to means the whole day; days are mon..sun, of the instant's local date):
# [[location.tariff]]
# from = "00:00"
# to = "00:00"
# days = ["sat", "sun"]
# price_per_kwh = 0.169
