# Copy to config.toml (gitignored) and adjust. Re-read on every poll: no restart needed.
# Override path with CONFIG_PATH; `--interval` / `--interval-active` on the collector win over this file.

[poll]
interval = 300          # seconds between polls when parked/idle
interval_active = 60    # seconds while charging or driving (battery events arrive every ~2-6 min)

[service]
warn_days = 30     # dashboard warning when service is due within this many days...
warn_km = 1500     # ...or this many km

[co2]
# g_per_kwh = 60    # grid carbon intensity; enables CO2 figures in the Insights tab

[report]
timezone = "Europe/Paris"   # weeks run Monday to Sunday in this timezone
model = "sonnet"             # Claude Code model alias for the weekly report

[pricing]
# default_price_per_kwh = 0.25   # for charges away from any listed location; unset = cost unknown

[[location]]
name = "Home"
lat = 0.0
lon = 0.0
radius_m = 100
price_per_kwh = 0.0

[[location]]
name = "Example fast charger"
lat = 1.0
lon = 1.0
radius_m = 150
price_per_kwh = 0.20
