services:
  collector:
    build: .
    command: ["python", "-m", "polestar.collect", "--loop", "--interval", "300"]
    env_file: .env          # M2M_ENDPOINT, APP_ID, SECRET, ACCOUNT_ID
    volumes:
      - telemetry:/data
      - ./config.toml:/app/config.toml:ro,z   # poll intervals, priced locations
    restart: unless-stopped

  app:
    build: .
    volumes:
      - telemetry:/data
      - ./config.toml:/app/config.toml:ro,z
    environment:
      BATTERY_KWH: ${BATTERY_KWH:-78}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}   # from .env; unset = editing off
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}   # from .env; unset = no login page
    # The dashboard has no authentication: bind to the Tailscale IP only.
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8501:8501"
    depends_on: [collector]
    restart: unless-stopped

volumes:
  telemetry:
