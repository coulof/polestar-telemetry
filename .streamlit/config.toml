[server]
headless = true
enableStaticServing = true   # serves ./static (the font) at /app/static

[client]
toolbarMode = "minimal"   # hides the Deploy button, keeps the menu

[browser]
gatherUsageStats = false

[theme]
baseRadius = "large"
font = "Inter"   # free stand-in for Polestar's Unica77 (licensed): swap the file below + this name

[[theme.fontFaces]]
family = "Inter"
url = "app/static/inter-latin-wght-normal.woff2"
weight = "100 900"
style = "normal"

[theme.light]
primaryColor = "#ED760E"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#ECECE7"   # brand Grey 0
textColor = "#0b0b0b"

[theme.dark]
primaryColor = "#FF7500"
backgroundColor = "#1a1a19"
secondaryBackgroundColor = "#252524"
textColor = "#f0efec"
