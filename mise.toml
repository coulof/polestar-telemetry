[tools]
python = "3.13"
uv = "latest"

[env]
_.file = ".env"
_.python.venv = { path = ".venv", create = true }

[tasks.setup]
description = "Install dependencies"
run = "uv sync"

[tasks.smoke]
description = "Check auth and telemetry endpoints (prints field names only)"
run = "uv run python smoke.py"

[tasks.collect]
description = "Poll the API once and store a snapshot"
run = "uv run python -m polestar.collect --once"

[tasks.watch]
description = "Poll the API in a loop"
run = "uv run python -m polestar.collect --loop"

[tasks.app]
description = "Run the dashboard"
run = "uv run streamlit run app.py"

[tasks.report]
description = "Development only: write a report (default: last week; --period ID) into the LOCAL database (data/telemetry.db), not the deployed stack. On a deployed stack run deploy/report.sh"
run = "uv run python -m polestar.report --generate"

[tasks.test]
description = "Run tests"
run = "uv run pytest"

# Local deploy for a new setup: containers (collector + dashboard) and the Claude reports timer.
[tasks.deploy]
description = "Deploy locally: check prerequisites, start the stack, install the Claude reports timer"
depends = ["deploy:claude"]

[tasks."deploy:check"]
description = "Check .env, config.toml and a container engine (creates config.toml from the example)"
hide = true
run = """
set -eu
[ -f .env ] || { echo "missing .env (M2M_ENDPOINT, APP_ID, SECRET, ACCOUNT_ID): see docs/configuration.md" >&2; exit 1; }
[ -f config.toml ] || { cp config.example.toml config.toml; echo "created config.toml from the example: edit it"; }
command -v podman-compose >/dev/null || docker compose version >/dev/null 2>&1 \
  || { echo "need podman-compose or docker compose" >&2; exit 1; }
"""

[tasks."deploy:stack"]
description = "Build and start the collector and dashboard, wait until healthy (http://127.0.0.1:8501)"
depends = ["deploy:check"]
run = """
set -eu
chmod 644 config.toml; chmod 600 .env
if command -v podman-compose >/dev/null; then podman-compose up -d --build; else docker compose up -d --build; fi
for _ in $(seq 1 30); do
  curl -fsS "http://${BIND_ADDR:-127.0.0.1}:8501/_stcore/health" >/dev/null 2>&1 && { echo "dashboard healthy"; exit 0; }
  sleep 2
done
echo "dashboard did not become healthy" >&2; exit 1
"""

[tasks."deploy:claude"]
description = "Install the daily Claude reports timer (needs podman and a logged-in claude CLI) and check the login"
depends = ["deploy:stack"]
run = """
set -eu
python3 -c "import sys,tomllib; sys.exit(0 if tomllib.load(open('config.toml','rb')).get('report',{}).get('enabled',True) else 1)" \
  || { echo "Claude integration disabled in config.toml ([report] enabled = false): skipping the report timer"; exit 0; }
command -v claude >/dev/null || { echo "claude CLI not found: install it and log in, then re-run" >&2; exit 1; }
command -v podman >/dev/null || { echo "the report timer needs podman (report.sh uses podman exec)" >&2; exit 1; }
printf ok | claude -p --tools "" --no-session-persistence --output-format text >/dev/null \
  || { echo "claude is not logged in: run claude and log in" >&2; exit 1; }
collector="$(podman ps --filter name=collector --format '{{ "{{" }}.Names{{ "}}" }}' | head -1)"
unit="$HOME/.config/systemd/user"; mkdir -p "$unit"
sed -e "s|%h/src/polestar-telemetry|$PWD|" \
    -e "/^\\[Service\\]/a Environment=COLLECTOR=$collector" \
    deploy/polestar-report.service > "$unit/polestar-report.service"
cp deploy/polestar-report.timer "$unit/"
systemctl --user daemon-reload && systemctl --user enable --now polestar-report.timer
echo "report timer enabled (daily catch-up); run it now with: deploy/report.sh"
"""

# Public demo (demo/compose.yml): real dashboard on synthetic data with a frozen clock, behind a Cloudflare Tunnel run on the host
[tasks."demo:build"]
description = "Build the demo image (synthetic database, frozen clock)"
run = "podman build -f demo/Dockerfile -t polestar-demo ."

[tasks."demo:up"]
description = "Start the demo container (127.0.0.1:8599)"
run = "podman-compose -f demo/compose.yml up -d --build"

[tasks."demo:down"]
description = "Stop the demo container"
run = "podman-compose -f demo/compose.yml down"

[tasks."demo:logs"]
description = "Follow the demo logs"
run = "podman-compose -f demo/compose.yml logs -f"

[tasks."demo:tunnel"]
description = "Run the Cloudflare Tunnel polestar-demo on the host (ingress is set in the Zero Trust dashboard)"
run = "npx wrangler tunnel run 652adbb9-3791-462f-b856-c33a037c292a"
